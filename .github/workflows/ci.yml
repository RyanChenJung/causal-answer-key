name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      UV_COMPILE_BYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the locked environment
        run: uv sync --locked
      - name: Notebook rules (no outputs, toolkit-import cell)
        run: uv run python scripts/check_notebooks.py
      - name: Tests
        run: uv run pytest -q
      - name: Assembled notebook has no answerkey import
        run: |
          if [ -f scripts/assemble_notebook.py ]; then
            uv run python scripts/assemble_notebook.py --no-execute
            uv run python scripts/check_notebooks.py --assembled build/Team7_AnswerKey.ipynb
          else
            echo "scripts/assemble_notebook.py does not exist yet; skipping"
          fi
